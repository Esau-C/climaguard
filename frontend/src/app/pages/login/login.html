<div class="login-page">

  <div class="login-card">

    <div class="marca">
      <h1>ClimaGuard</h1>

      <p>
        Sistema de Monitoreo y Alertas
        de Riesgos Naturales
      </p>
    </div>

    <div class="formulario">

      <h2>Iniciar sesión</h2>

      <p class="subtitulo">
        Ingrese sus credenciales para continuar
      </p>

      <form
        (ngSubmit)="iniciarSesion()"
      >

        <div class="campo">

          <label for="username">
            Usuario
          </label>

          <input
            id="username"
            name="username"
            type="text"
            [(ngModel)]="username"
            placeholder="Ingrese su usuario"
            autocomplete="username"
          >

        </div>

        <div class="campo">

          <label for="password">
            Contraseña
          </label>

          <input
            id="password"
            name="password"
            type="password"
            [(ngModel)]="password"
            placeholder="Ingrese su contraseña"
            autocomplete="current-password"
          >

        </div>

        <div
          *ngIf="error()"
          class="error"
        >
          {{ error() }}
        </div>

        <button
          type="submit"
          [disabled]="cargando()"
        >

          <span *ngIf="!cargando()">
            Iniciar sesión
          </span>

          <span *ngIf="cargando()">
            Ingresando...
          </span>

        </button>

      </form>

    </div>

  </div>

</div>
